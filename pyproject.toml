[project]
name = "shittycity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# shapely < 2.1 bundles GEOS 3.11, which rebuilds data/jsh byte for byte; 2.1+ (GEOS 3.13) changes simplify() and
# minimum_rotated_rectangle, turning about 570 houses and 20 barns half a turn and merging a farm field.
data = [
    "numpy>=2.5.4",
    "osmium>=4.3.2",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "shapely>=2.0.7,<2.1",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
fetch = [
    "duckdb>=2.0.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
]
qa = [
    "pillow>=13.0.0",
    "playwright>=1.65.1",
]
